# Publishes approved reader comments.
#
# Every 3 hours (and whenever you press "Run workflow" on the Actions tab),
# this reads the approved comments from the comments Google Sheet
# (_tools/comments.gs), writes them into the article pages with the normal
# build, and commits the result to main so the live site updates.
# It does nothing until COMMENTS_ENDPOINT is set in config.js, and it only
# commits when an approved comment or reply has changed.
name: Publish comments

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-comments
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download approved comments
        id: fetch
        run: |
          result="$(node _tools/fetch-comments.mjs)"
          echo "$result"
          case "$result" in changed*) echo "changed=true" >> "$GITHUB_OUTPUT" ;; esac
      - name: Build pages and commit
        if: steps.fetch.outputs.changed == 'true'
        run: |
          node _tools/build-site.mjs
          node _tools/build-site.mjs --check
          git config user.name "rencalago-comments-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish approved comments"
          git push
